<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sip of Ghoulaid | Owner Sign In</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <main class="admin-shell">
        <a class="back-link" href="index.html">← RETURN TO STOREFRONT</a>
        <header class="admin-header">
            <p class="eyebrow">SIP OF GHOULAID / OWNER FREQUENCY</p>
            <h1>THE GHOUL ROOM</h1>
            <p>Owner sign-in required.</p>
        </header>
        <section class="admin-panel login-panel">
            <h2>OWNER LOGIN</h2>
            <p class="prototype-warning">This private portal is for Sip of Ghoulaid owners only. Use the credentials configured in the site’s private hosting settings.</p>
            <form id="ownerLoginForm">
                <label for="ownerUsername">Username</label>
                <input id="ownerUsername" name="username" autocomplete="username" required>
                <label for="ownerPassword">Password</label>
                <input id="ownerPassword" name="password" type="password" autocomplete="current-password" required>
                <button class="submit-btn" type="submit">UNLOCK CONSOLE</button>
                <p id="ownerLoginMessage" class="form-message" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="owner-login.js"></script>
</body>
</html>
