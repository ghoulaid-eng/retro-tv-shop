services:
  - type: web
    name: sip-of-ghoulaid
    runtime: node
    buildCommand: npm install && npm run db:generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SHIPPING_RATE_IDS
        sync: false
      - key: STRIPE_ALLOWED_SHIPPING_COUNTRIES
        value: US
